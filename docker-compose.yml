services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./primacura-backend
      dockerfile: Dockerfile
    volumes:
      # Persist the LanceDB vector database between container restarts
      - vectordb_data:/app/app_first_aid_vectordb
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./primacura-frontend
      dockerfile: Dockerfile
      args:
        # Defaults to production API URL; can be overridden in local .env
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-https://api.primacura.health}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vectordb_data:
  caddy_data:
  caddy_config: