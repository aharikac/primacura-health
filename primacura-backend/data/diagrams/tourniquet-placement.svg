<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" aria-label="Tourniquet placement: 2 to 3 inches above the wound, on the side nearer the heart, never on a joint such as the elbow." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe9"/><stop offset="1" stop-color="#efe4db"/></linearGradient></defs><g stroke="#d6c7bb" stroke-width="2" fill="url(#skin)" stroke-linejoin="round"><path d="M20 120 C 20 104, 34 98, 52 98 L 180 104 C 196 104, 206 106, 214 110 L 318 116 C 332 117, 340 124, 340 134 C 340 144, 332 151, 318 152 L 214 158 C 206 162, 196 164, 180 164 L 52 170 C 34 170, 20 164, 20 148 Z"/></g><path d="M200 106 C 194 120, 194 150, 200 162" stroke="#cdbcae" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M286 126 C 292 120, 300 122, 302 128 C 306 132, 304 140, 298 142 C 292 146, 284 142, 284 136 C 282 132, 282 128, 286 126 Z" fill="#d33b32"/><text x="294" y="98" font-size="12" font-weight="800" fill="#d33b32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">WOUND</text><rect x="234" y="108" width="16" height="52" rx="4" fill="#27272a"/><rect x="222" y="128" width="40" height="7" rx="3.5" fill="#71717a"/><line x1="242" y1="176" x2="294" y2="176" stroke="#9f1d15" stroke-width="2"/><line x1="242" y1="170" x2="242" y2="182" stroke="#9f1d15" stroke-width="2"/><line x1="294" y1="170" x2="294" y2="182" stroke="#9f1d15" stroke-width="2"/><text x="268" y="200" font-size="13" font-weight="900" fill="#9f1d15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2–3 in</text><text x="194" y="88" font-size="12" font-weight="800" fill="#71717a" text-anchor="end" font-family="Helvetica, Arial, sans-serif">ELBOW — NOT HERE</text><line x1="150" y1="214" x2="40" y2="214" stroke="#71717a" stroke-width="2.5" stroke-linecap="round"/><path d="M40 214 L48.8 209.2 L48.8 218.8 Z" fill="#71717a"/><text x="158" y="219" font-size="12" font-weight="800" fill="#71717a" font-family="Helvetica, Arial, sans-serif">TOWARD THE HEART</text><line x1="250" y1="110" x2="262" y2="62" stroke="#d33b32" stroke-width="2"/><circle cx="264" cy="52" r="13" fill="#d33b32"/><text x="264" y="56.5" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><circle cx="33" cy="265" r="10" fill="#d33b32"/><text x="33" y="269" font-size="11" font-weight="900" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="50" y="270" font-size="14" font-weight="700" fill="#3f3f46" font-family="Helvetica, Arial, sans-serif">Tourniquet 2–3 in above the wound</text><text x="24" y="290" font-size="13" font-weight="600" fill="#71717a" font-family="Helvetica, Arial, sans-serif">On the side nearer the heart — never on a joint.</text></svg>
