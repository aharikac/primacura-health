<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" aria-label="心肺復甦按壓深度：成人至少2英寸（5釐米），兒童約2英寸（5釐米），嬰兒約1½英寸（4釐米），每分鐘100到120次。" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe9"/><stop offset="1" stop-color="#efe4db"/></linearGradient></defs><text x="180" y="28" font-size="15" font-weight="900" fill="#050505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">按壓深度</text><text x="64" y="58" font-size="12" font-weight="800" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">成人</text><rect x="24" y="70" width="80" height="16" rx="8" fill="#efe4db" stroke="#d6c7bb" stroke-width="2"/><rect x="24" y="194.0" width="80" height="16" rx="8" fill="#d33b32" fill-opacity="0.18" stroke="#d33b32" stroke-width="2" stroke-dasharray="5 4"/><line x1="64" y1="92" x2="64" y2="190.0" stroke="#d33b32" stroke-width="3" stroke-linecap="round"/><path d="M64 190.0 L59.2 181.2 L68.8 181.2 Z" fill="#d33b32"/><text x="64" y="236.0" font-size="12" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">至少</text><text x="64" y="254.0" font-size="14" font-weight="900" fill="#9f1d15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2英寸（5釐米）</text><text x="180" y="58" font-size="12" font-weight="800" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">兒童</text><rect x="140" y="70" width="80" height="16" rx="8" fill="#efe4db" stroke="#d6c7bb" stroke-width="2"/><rect x="140" y="194.0" width="80" height="16" rx="8" fill="#d33b32" fill-opacity="0.18" stroke="#d33b32" stroke-width="2" stroke-dasharray="5 4"/><line x1="180" y1="92" x2="180" y2="190.0" stroke="#d33b32" stroke-width="3" stroke-linecap="round"/><path d="M180 190.0 L175.2 181.2 L184.8 181.2 Z" fill="#d33b32"/><text x="180" y="236.0" font-size="12" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">約</text><text x="180" y="254.0" font-size="14" font-weight="900" fill="#9f1d15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2英寸（5釐米）</text><text x="296" y="58" font-size="12" font-weight="800" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">嬰兒</text><rect x="256" y="70" width="80" height="16" rx="8" fill="#efe4db" stroke="#d6c7bb" stroke-width="2"/><rect x="256" y="163.0" width="80" height="16" rx="8" fill="#d33b32" fill-opacity="0.18" stroke="#d33b32" stroke-width="2" stroke-dasharray="5 4"/><line x1="296" y1="92" x2="296" y2="159.0" stroke="#d33b32" stroke-width="3" stroke-linecap="round"/><path d="M296 159.0 L291.2 150.2 L300.8 150.2 Z" fill="#d33b32"/><text x="296" y="205.0" font-size="12" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">約</text><text x="296" y="223.0" font-size="14" font-weight="900" fill="#9f1d15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1½英寸（4釐米）</text><line x1="20" y1="280" x2="340" y2="280" stroke="#e4e4e7" stroke-width="2"/><text x="24" y="306" font-size="13" font-weight="600" fill="#71717a" font-family="Helvetica, Arial, sans-serif">所有年齡都是每分鐘100–120次。</text><text x="24" y="326" font-size="13" font-weight="600" fill="#71717a" font-family="Helvetica, Arial, sans-serif">每次都讓胸部完全回彈。</text></svg>
