<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" aria-label="How deep to push during CPR: adult at least 2 inches (5 cm), child about 2 inches (5 cm), infant about 1 and a half inches (4 cm), at 100 to 120 pushes a minute." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe9"/><stop offset="1" stop-color="#efe4db"/></linearGradient></defs><text x="180" y="28" font-size="15" font-weight="900" fill="#050505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">How deep to push</text><text x="64" y="58" font-size="12" font-weight="800" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">ADULT</text><rect x="24" y="70" width="80" height="16" rx="8" fill="#efe4db" stroke="#d6c7bb" stroke-width="2"/><rect x="24" y="194.0" width="80" height="16" rx="8" fill="#d33b32" fill-opacity="0.18" stroke="#d33b32" stroke-width="2" stroke-dasharray="5 4"/><line x1="64" y1="92" x2="64" y2="190.0" stroke="#d33b32" stroke-width="3" stroke-linecap="round"/><path d="M64 190.0 L59.2 181.2 L68.8 181.2 Z" fill="#d33b32"/><text x="64" y="236.0" font-size="12" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">At least</text><text x="64" y="254.0" font-size="14" font-weight="900" fill="#9f1d15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2 in (5 cm)</text><text x="180" y="58" font-size="12" font-weight="800" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">CHILD</text><rect x="140" y="70" width="80" height="16" rx="8" fill="#efe4db" stroke="#d6c7bb" stroke-width="2"/><rect x="140" y="194.0" width="80" height="16" rx="8" fill="#d33b32" fill-opacity="0.18" stroke="#d33b32" stroke-width="2" stroke-dasharray="5 4"/><line x1="180" y1="92" x2="180" y2="190.0" stroke="#d33b32" stroke-width="3" stroke-linecap="round"/><path d="M180 190.0 L175.2 181.2 L184.8 181.2 Z" fill="#d33b32"/><text x="180" y="236.0" font-size="12" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">About</text><text x="180" y="254.0" font-size="14" font-weight="900" fill="#9f1d15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2 in (5 cm)</text><text x="296" y="58" font-size="12" font-weight="800" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">INFANT</text><rect x="256" y="70" width="80" height="16" rx="8" fill="#efe4db" stroke="#d6c7bb" stroke-width="2"/><rect x="256" y="163.0" width="80" height="16" rx="8" fill="#d33b32" fill-opacity="0.18" stroke="#d33b32" stroke-width="2" stroke-dasharray="5 4"/><line x1="296" y1="92" x2="296" y2="159.0" stroke="#d33b32" stroke-width="3" stroke-linecap="round"/><path d="M296 159.0 L291.2 150.2 L300.8 150.2 Z" fill="#d33b32"/><text x="296" y="205.0" font-size="12" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">About</text><text x="296" y="223.0" font-size="14" font-weight="900" fill="#9f1d15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1½ in (4 cm)</text><line x1="20" y1="280" x2="340" y2="280" stroke="#e4e4e7" stroke-width="2"/><text x="24" y="306" font-size="13" font-weight="600" fill="#71717a" font-family="Helvetica, Arial, sans-serif">100–120 pushes a minute, for every age.</text><text x="24" y="326" font-size="13" font-weight="600" fill="#71717a" font-family="Helvetica, Arial, sans-serif">Let the chest come all the way back up each time.</text></svg>
